<h3>Greetings!</h3>

I'm William Cohen, and I'm going to try to simulate giving you a
"live" demo.  This frame will contain my running commmentary on the
demo.  This demo was originally presented at SIGMOD-98, and concerns a
system called WHIRL.  WHIRL is designed to make it easy to provide a
database-like interface to information on the Web.

<p>This demo is really designed for frames, which you browser doesn't
seem to support.  You may be able to make do by reading the
running commentary, in order.
