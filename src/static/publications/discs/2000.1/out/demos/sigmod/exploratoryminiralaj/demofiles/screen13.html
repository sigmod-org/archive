<H2>Consequent Aggregate Constraint</H2>
<P>
Since the store manager is only interested in
finding those higher priced sets of items purchased
with the snack, soda combo, we have to create here the
consequent aggregate constraint that the average
price of items in the set is greater than or equal to
$6.
