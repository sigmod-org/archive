function buildtable(){
  var paraCount=buildtable.arguments.length;
  if (paraCount<2) 
    alert("ParameterAnzahl zum Aufbau der Tabelle falsch");
  var row=buildtable.arguments[0];
  var col=buildtable.arguments[1];
  
  document.write("<table "+">");
  
  for (i=0;i<row;i++){
    document.write("<tr "+">");
    for (j=0;j<col;j++){
      document.write("<td "+">");
      text.document.write(buildtable.arguments[i*col+j+2]);
    }
  }

  document.write("</table>");
}

var ht_element, ht_value;

function hashtable_init(){
  ht_element=null;
  ht_value=null;
  ht_element=new Array();
  ht_value=new Array();
}

function hashtable(add_ele, add_val){
  if ((add_ele.type=="radio") || (add_ele.type=="checkbox")){
    if (add_ele.checked){
      //alert("Ausgewähltges Feld: "+add_ele.name);
      ht_element[ht_element.length]=add_ele.name;
      ht_value[ht_value.length]=add_val;
    } //else alert("nicht ausgewähltes Feld: "+add_ele.name);
  }
  else {
    ht_element[ht_element.length]=add_ele.name;
    ht_value[ht_value.length]=add_val;
  }
}

function ret_hashtable(){
  return(ht_element, ht_value);
}
